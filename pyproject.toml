[project]
name = "forgeagent"
version = "0.2.0"
description = "Durable, evidence-bound coding agent runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "boto3>=1.37,<2",
  "PyJWT[crypto]>=2.10,<3",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "prometheus-client>=0.21,<1",
  "openai>=1.68,<3",
  "anthropic>=0.49,<1",
  "mcp>=1.9,<2",
  "a2a-sdk>=0.3,<1",
  "tiktoken>=0.9,<1",
  "jsonschema>=4.23,<5",
]
[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "hypothesis>=6.127,<7",
    "ruff>=0.11,<1",
    "ty==0.0.85",
]
[project.scripts]
forge = "forgeagent.cli:app"
forge-worker = "forgeagent.worker:main"
forge-maintenance = "forgeagent.maintenance_jobs:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/forgeagent"]
[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
