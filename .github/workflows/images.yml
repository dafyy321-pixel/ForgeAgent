name: Release images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  contracts:
    uses: ./.github/workflows/runtime.yml
  gates:
    needs: contracts
    uses: ./.github/workflows/release-gates.yml
    secrets: inherit
  build:
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, manager, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/forgeagent-${{ matrix.target }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
      - name: Record deployment digest
        env:
          TARGET: ${{ matrix.target }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${TARGET} ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
