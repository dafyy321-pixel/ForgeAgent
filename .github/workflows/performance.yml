name: Scheduler Performance
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: Separate throughput limit for the 20-task fixture (seconds)
        required: true
        default: '45'
  schedule:
    - cron: '17 3 * * 1'
concurrency:
  group: scheduler-performance
  cancel-in-progress: false
jobs:
  profile:
    # Opt in only after provisioning one dedicated machine with this label.
    if: vars.FORGE_PERFORMANCE_ENABLED == '1'
    runs-on: [self-hosted, linux, x64, forge-performance]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: test-admin
        ports: ['55432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FORGE_DATABASE_URL: postgresql+psycopg://forge:forge-local@127.0.0.1:55432/forge
      FORGE_TEST_RELEASE: '0'
      FORGE_TEST_LIVE_RECOVERY: '0'
      FORGE_SCHEDULER_MAX_SECONDS: ${{ inputs.max_seconds || vars.FORGE_PERFORMANCE_MAX_SECONDS || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Provision isolated database
        env:
          PGPASSWORD: test-admin
        run: psql -h 127.0.0.1 -p 55432 -U postgres -f infra/init.sql
      - run: uv run alembic upgrade head
      - name: Measure correctness and separate performance limit
        run: >-
          uv run python scripts/profile-scheduler.py --require-clean
          --environment-id dedicated-forge-performance
          --output .forge/performance-${{ github.run_id }}-${{ github.run_attempt }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: .forge/performance-*.json
          retention-days: 90
