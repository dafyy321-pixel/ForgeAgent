name: Runtime Contracts
on:
  push:
  pull_request:
  workflow_call:
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: test-admin
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FORGE_DATABASE_URL: postgresql+psycopg://forge:forge-local@127.0.0.1:55432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: npm ci
      - name: Install pinned static REA runtime
        run: npm run rea:install
      - name: Provision non-superuser database
        env:
          PGPASSWORD: test-admin
        run: psql -h 127.0.0.1 -p 55432 -U postgres -f infra/init.sql
      - run: uv run alembic upgrade head
      - run: uv run ruff check backend tests/backend migrations
      - run: uv run ty check backend/forgeagent
      - name: Check platform-specific process supervision types
        run: |
          uv run ty check backend/forgeagent/processes.py --python-platform linux
          uv run ty check backend/forgeagent/processes.py --python-platform win32
      - run: npm run lint
      - run: npm run format:check
      - run: npm run types:check
      - run: uv build --out-dir .forge/dist
      - name: Verify isolated wheel imports and CLI entry point
        run: |
          uv run --no-project --isolated --with .forge/dist/forgeagent-0.2.0-py3-none-any.whl python -c "from forgeagent.sdk import Client; from forgeagent.contracts import RunView; from forgeagent.cli import app"
          uv run --no-project --isolated --with .forge/dist/forgeagent-0.2.0-py3-none-any.whl forge --help
      - run: docker build -t forgeagent-sandbox:local sandbox
      - name: Install verified gVisor runtime on the hosted runner
        run: |
          cd "$RUNNER_TEMP"
          curl -fsS --retry 3 -o gvisor.tar.zstd \
            https://storage.googleapis.com/gvisor/releases/release/20261116.0/x86_64/gvisor.tar.zstd
          printf '%s  %s\n' 'a34261504066142b6c1cc4d1813bb2d092761675416e350edc98c4cc66469b63b6f41acdeed09681b6c717c00e80e437f5f2f9c8d37705b8a9260632867c2b7d' gvisor.tar.zstd | sha512sum --check
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          /usr/local/bin/runsc --version
      - name: Exercise the shared Compose worker and HTTPS manager with runsc
        timeout-minutes: 15
        run: bash scripts/deploy-manager-smoke.sh
      - run: uv run pytest tests/backend -q
        env:
          FORGE_TEST_DOCKER: "1"
      - run: npm run build
      - name: Start runtime
        run: |
          # Long-lived uv run processes hold the cache lock and block setup-uv's post-job prune.
          .venv/bin/python -m uvicorn forgeagent.api:app --host 127.0.0.1 --port 8000 > /tmp/forge-api.log 2>&1 &
          echo "FORGE_API_PID=$!" >> "$GITHUB_ENV"
          .venv/bin/forge-worker > /tmp/forge-worker.log 2>&1 &
          echo "FORGE_WORKER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/ready && exit 0; sleep 1; done
          cat /tmp/forge-api.log /tmp/forge-worker.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Stop runtime
        if: always()
        run: |
          for pid in "$FORGE_WORKER_PID" "$FORGE_API_PID"; do
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
