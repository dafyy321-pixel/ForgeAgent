name: forgeagent
x-runtime: &runtime
  image: ${FORGE_RUNTIME_IMAGE:?Set a published runtime image pinned by digest}
  env_file: ${FORGE_DEPLOY_ENV_FILE:?Set private runtime environment file}
  environment:
    FORGE_AUTH_MODE: oidc
    FORGE_DATA_DIR: ${FORGE_SHARED_DATA}
    FORGE_SANDBOX_MANAGER_URL: https://sandbox-manager:8443
    FORGE_SANDBOX_RUNTIME: runsc
    SSL_CERT_FILE: /run/tls/ca.crt
    OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
  volumes:
    - ${FORGE_SHARED_DATA:?Set absolute shared data path}:${FORGE_SHARED_DATA}
    - ${FORGE_TLS_DIR:?Set private TLS directory}:/run/tls:ro
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=128m,mode=1777]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
  depends_on:
    postgres: {condition: service_healthy}
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets: [postgres_admin, postgres_app]
    volumes:
      - forge-postgres:/var/lib/postgresql/data
      - ./infra/deploy-init.sh:/docker-entrypoint-initdb.d/01-forge.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U forge_admin -d forge"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
  migrate:
    <<: *runtime
    restart: "no"
    command: [alembic, upgrade, head]
  api:
    <<: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 10s
      retries: 12
  worker:
    <<: *runtime
    command: [python, -m, forgeagent.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      api: {condition: service_healthy}
  maintenance:
    <<: *runtime
    command: [python, -m, forgeagent.maintenance_jobs]
    depends_on:
      migrate: {condition: service_completed_successfully}
  sandbox-manager:
    image: ${FORGE_MANAGER_IMAGE:?Set a published manager image pinned by digest}
    env_file: ${FORGE_MANAGER_ENV_FILE:?Set private manager environment file without DB/model/S3 secrets}
    environment:
      FORGE_AUTH_MODE: oidc
      FORGE_DATA_DIR: ${FORGE_SHARED_DATA}
      FORGE_SANDBOX_RUNTIME: runsc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
    group_add: ["${FORGE_DOCKER_GID:?Set host Docker socket group id}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker bind mounts use the host path. Keep the same absolute path visible in
      # the manager and workers, or configure a dedicated mount translation host.
      - ${FORGE_SHARED_DATA}:${FORGE_SHARED_DATA}
      - ${FORGE_TLS_DIR}:/run/tls:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private]
  web:
    image: ${FORGE_WEB_IMAGE:?Set a published web image pinned by digest}
    volumes: ["${FORGE_TLS_DIR}:/run/tls:ro"]
    ports: ["${FORGE_BIND_IP:-127.0.0.1}:8443:443"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
  telemetry:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: [--config=/etc/otel/config.yaml]
    volumes: [./infra/otel.yaml:/etc/otel/config.yaml:ro]
    restart: unless-stopped
    networks: [private]
  minio:
    profiles: [s3]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data]
    env_file: ${FORGE_MINIO_ENV_FILE:-.env.minio}
    volumes: [forge-objects:/data]
    restart: unless-stopped
    networks: [private]
  minio-init:
    profiles: [s3]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: ${FORGE_MINIO_BOOTSTRAP_ENV_FILE:-.env.minio-bootstrap}
    volumes:
      - ./infra/minio-init.sh:/bootstrap.sh:ro
      - ./infra/minio-policy.json:/policy.json:ro
    entrypoint: [/bin/sh, /bootstrap.sh]
    depends_on: [minio]
    restart: "no"
    networks: [private]
volumes:
  forge-postgres:
  forge-objects:
networks:
  private:
secrets:
  postgres_admin:
    file: ${FORGE_POSTGRES_ADMIN_FILE:?Set administrator password file}
  postgres_app:
    file: ${FORGE_POSTGRES_APP_FILE:?Set application password file}
